---
kind: SignalGroup
metadata:
  name: scalar_vector
  labels:
    channel: scalar
  annotations:
    vector_type: scalar
spec:
  signals:
    - signal: scalar_in
      annotations:
        fmi_variable_vref: 1001
        fmi_variable_name: scalar_in
        fmi_variable_type: Real
        fmi_variable_causality: input
    - signal: scalar_out
      annotations:
        fmi_variable_vref: 1002
        fmi_variable_name: scalar_out
        fmi_variable_type: Real
        fmi_variable_causality: output
---
kind: SignalGroup
metadata:
  name: scalar_vector2
  labels:
    channel: scalar
  annotations:
    vector_type: scalar
spec:
  signals:
    - signal: scalar_in2
      annotations:
        fmi_variable_vref: 1004
        fmi_variable_name: scalar_in2
        fmi_variable_type: Real
        fmi_variable_causality: input
    - signal: scalar_out2
      annotations:
        fmi_variable_vref: 1005
        fmi_variable_name: scalar_out2
        fmi_variable_type: Real
        fmi_variable_causality: output
---
kind: SignalGroup
metadata:
  name: binary_vector
  labels:
    channel: binary
    type: binary
  annotations:
    vector_type: binary
    vector_name: network_vector
spec:
  signals:
    - signal: can
      annotations:
        mime_type: 'application/x-automotive-bus; interface=stream; type=frame; bus=can; schema=fbs; bus_id=1; node_id=11; interface_id=0'
        fmi_variable_vref: 2
        # FMI variables carry FMI-LS-BUS operations (Bus Terminal "CAN").
        dse.standards.fmi-ls-bus.enabled: true
        dse.standards.fmi-ls-bus-topology.bus_id: 1
        dse.standards.fmi-ls-bus-topology.rx_vref: [2]
        dse.standards.fmi-ls-bus-topology.tx_vref: [3]
